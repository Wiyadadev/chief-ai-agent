name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:   # กดรันเองจากแท็บ Actions ได้ด้วย ไม่ต้องรอ push

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Prepend Hugging Face Space YAML header to README
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for file in space-readme-header.yml README.md; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Required sync input is missing or empty in this checkout. Restore the tracked file; do not invent Space configuration."
              exit 1
            fi
          done

          # Refuse to duplicate an existing header or replace unverified Space config.
          if [[ "$(head -n 1 README.md)" == '---' ]]; then
            echo "::error file=README.md::README already has frontmatter; reconcile it with space-readme-header.yml before syncing."
            exit 1
          fi

          readme_tmp=$(mktemp)
          trap 'rm -f "$readme_tmp"' EXIT
          cat space-readme-header.yml README.md > "$readme_tmp"
          mv "$readme_tmp" README.md
          # ไฟล์นี้ใช้แค่ตอน sync เท่านั้น ไม่ commit กลับเข้า GitHub repo หลัก

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HF_TOKEN" ]]; then
            echo "::error::HF_TOKEN secret is required for the Hugging Face sync."
            exit 1
          fi

          askpass=$(mktemp)
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'vyada' ;;
            *Password*) printf '%s\n' "$HF_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"

          git remote add space https://vyada@huggingface.co/spaces/vyada/vyada-systems
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git fetch space main
          git reset --soft space/main
          git add --all

          if git diff --cached --quiet; then
            echo "Hugging Face Space is already up to date."
            exit 0
          fi

          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git commit -m "Sync GitHub main to Hugging Face Space"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git push space HEAD:main
