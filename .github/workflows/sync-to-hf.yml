name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:   # กดรันเองจากแท็บ Actions ได้ด้วย ไม่ต้องรอ push

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Prepend Hugging Face Space YAML header to README
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for file in space-readme-header.yml README.md; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Required sync input is missing or empty in this checkout. Restore the tracked file; do not invent Space configuration."
              exit 1
            fi
          done

          # Refuse to duplicate an existing header or replace unverified Space config.
          if [[ "$(head -n 1 README.md)" == '---' ]]; then
            echo "::error file=README.md::README already has frontmatter; reconcile it with space-readme-header.yml before syncing."
            exit 1
          fi

          readme_tmp=$(mktemp)
          trap 'rm -f "$readme_tmp"' EXIT
          cat space-readme-header.yml README.md > "$readme_tmp"
          mv "$readme_tmp" README.md
          # ไฟล์นี้ใช้แค่ตอน sync เท่านั้น ไม่ commit กลับเข้า GitHub repo หลัก

      - name: Commit README change locally (for the Space push only)
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add README.md
          git commit -m "Add HF Space YAML frontmatter for sync" --allow-empty
          # commit นี้อยู่แค่ใน working copy ชั่วคราวของ Action runner เท่านั้น
          # ไม่มีการ push กลับไปที่ origin (GitHub) เลย — push ไปแค่ remote "space" ด้านล่าง

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add space https://vyada:${HF_TOKEN}@huggingface.co/spaces/vyada/vyada-systems
          git push --force space HEAD:main
